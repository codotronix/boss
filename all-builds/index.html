<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS - Version Selection</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }
        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .version-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .version-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .version-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.2);
        }
        .version-link {
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }
        .version-description {
            margin-top: 0.5rem;
            opacity: 0.8;
            font-size: 0.9rem;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 BOSS</h1>
        <p style="text-align: center; font-size: 1.2rem; margin-bottom: 2rem;">
            Select a version to explore
        </p>
        
        <div class="version-grid">
            <div class="version-card">
                <a href="./v0/" class="version-link">
                    V0
                </a>
                <div class="version-description">
                    Click to access v0
                </div>
            </div>
            <div class="version-card">
                <a href="./v1/" class="version-link">
                    V1
                </a>
                <div class="version-description">
                    Click to access v1
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Generated on 12/29/2025</p>
        </div>
    </div>
</body>
</html>
